<!-- Map Overlay Image Carousel Script -->
<script>
(function() {
    let currentOverlayImage = 0;
    const overlayImages = ['overlay-image-1', 'overlay-image-2'];
    const overlayDots = ['overlay-dot-1', 'overlay-dot-2'];
    let overlayAutoInterval = null;
    
    function updateOverlayImage() {
        try {
            overlayImages.forEach((id, index) => {
                const img = document.getElementById(id);
                const dot = document.getElementById(overlayDots[index]);
                if (img) {
                    img.classList.toggle('opacity-100', index === currentOverlayImage);
                    img.classList.toggle('opacity-0', index !== currentOverlayImage);
                }
                if (dot) {
                    dot.classList.toggle('bg-white', index === currentOverlayImage);
                    dot.classList.toggle('bg-white/50', index !== currentOverlayImage);
                }
            });
        } catch (e) {
            console.error('Overlay image update error:', e);
        }
    }
    
    function resetAutoInterval() {
        if (overlayAutoInterval) clearInterval(overlayAutoInterval);
        overlayAutoInterval = setInterval(() => {
            currentOverlayImage = (currentOverlayImage + 1) % overlayImages.length;
            updateOverlayImage();
        }, 60000); // 60 seconds
    }
    
    window.nextOverlayImage = function() {
        try {
            currentOverlayImage = (currentOverlayImage + 1) % overlayImages.length;
            updateOverlayImage();
            resetAutoInterval();
        } catch (e) {
            console.error('Next overlay image error:', e);
        }
    };
    
    window.prevOverlayImage = function() {
        try {
            currentOverlayImage = (currentOverlayImage - 1 + overlayImages.length) % overlayImages.length;
            updateOverlayImage();
            resetAutoInterval();
        } catch (e) {
            console.error('Prev overlay image error:', e);
        }
    };
    
    // Start auto-rotation on page load
    resetAutoInterval();
})();
</script>
