<script>
// Initialize navbar links based on context (index vs subpage)
(function initNavbarLinks() {
    const isIndex = window.location.pathname.endsWith('index.html') || window.location.pathname.endsWith('/');
    const prefix = isIndex ? 'data-href-index' : 'data-href-page';
    const imgPrefix = isIndex ? 'data-src-index' : 'data-src-page';
    
    // Update all navigation links
    document.querySelectorAll('[data-href-index]').forEach(link => {
        const href = link.getAttribute(prefix);
        if (href) link.href = href;
    });
    
    // Update logo image
    document.querySelectorAll('[data-src-index]').forEach(img => {
        const src = img.getAttribute(imgPrefix);
        if (src) img.src = src;
    });
})();

// Navigate home
function goHome(e) {
    e.preventDefault();
    const isIndex = window.location.pathname.endsWith('index.html') || window.location.pathname.endsWith('/');
    window.location.href = isIndex ? 'index.html' : '../index.html';
}

// Dropdown toggle
function toggleDropdown() {
    const menu = document.getElementById('dropdown-menu');
    const icon = document.querySelector('.dropdown-icon');
    if (menu) {
        menu.classList.toggle('dropdown-closed');
        menu.classList.toggle('dropdown-open');
    }
    if (icon) icon.classList.toggle('rotate-180');
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
    const container = document.getElementById('dropdown-container');
    const menu = document.getElementById('dropdown-menu');
    if (container && menu && !container.contains(e.target)) {
        menu.classList.add('dropdown-closed');
        menu.classList.remove('dropdown-open');
        document.querySelector('.dropdown-icon')?.classList.remove('rotate-180');
    }
    
    // Close mobile menu when clicking outside
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileBtn = document.getElementById('mobile-menu-btn');
    if (mobileMenu && mobileBtn && !mobileMenu.contains(e.target) && !mobileBtn.contains(e.target)) {
        if (mobileMenu.classList.contains('mobile-menu-open')) {
            toggleMobileMenu();
        }
    }
});

// Mobile menu toggle with animation
let mobileMenuOpen = false;
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    const iconOpen = document.getElementById('menu-icon-open');
    const iconClose = document.getElementById('menu-icon-close');
    
    if (!menu) return;
    
    mobileMenuOpen = !mobileMenuOpen;
    
    if (mobileMenuOpen) {
        menu.classList.remove('mobile-menu-closed');
        menu.classList.add('mobile-menu-open');
        if (iconOpen) iconOpen.classList.add('hidden');
        if (iconClose) iconClose.classList.remove('hidden');
        // Animate links sequentially
        const links = menu.querySelectorAll('.mobile-nav-link');
        links.forEach((link, i) => {
            link.style.opacity = '0';
            link.style.transform = 'translateX(20px)';
            setTimeout(() => {
                link.style.transition = 'all 0.3s ease';
                link.style.opacity = '1';
                link.style.transform = 'translateX(0)';
            }, 50 * (i + 1));
        });
    } else {
        menu.classList.remove('mobile-menu-open');
        menu.classList.add('mobile-menu-closed');
        if (iconOpen) iconOpen.classList.remove('hidden');
        if (iconClose) iconClose.classList.add('hidden');
    }
}

// Theme toggle - delegates to main.js Theme object
function toggleTheme() {
    if (typeof Theme !== 'undefined' && Theme.toggle) {
        Theme.toggle();
    } else {
        // Fallback if main.js not loaded yet
        document.documentElement.classList.toggle('dark');
        const theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        localStorage.setItem('theme', theme);
    }
}

// Language toggle - NO PAGE RELOAD, pure client-side switching
function toggleLanguage() {
    // Toggle language in localStorage
    let currentLang = localStorage.getItem('language') || 'fr';
    const newLang = currentLang === 'fr' ? 'en' : 'fr';
    localStorage.setItem('language', newLang);
    document.documentElement.lang = newLang;
    
    // Update all language display buttons
    updateLangDisplayButtons(newLang);
    
    // Use Language object if available, otherwise apply translations directly
    if (typeof Language !== 'undefined' && Language.toggle) {
        // Reset to match our change, then let Language handle it
        localStorage.setItem('language', currentLang); // Reset so toggle flips correctly
        Language.toggle();
    } else {
        // Direct translation application without page reload
        applyTranslations(newLang);
    }
}

// Update all language display buttons
function updateLangDisplayButtons(lang) {
    const displayText = lang === 'fr' ? 'FR' : 'EN';
    document.querySelectorAll('#lang-display, #mobile-lang-display, [data-lang-display]').forEach(el => {
        el.innerText = displayText;
    });
}

// Apply translations directly (fallback when main.js not ready)
function applyTranslations(lang) {
    // Wait for Language object to be available, then use it
    const checkAndApply = () => {
        if (typeof Language !== 'undefined' && Language.apply) {
            Language.current = lang;
            Language.apply();
        } else {
            // Retry in 100ms if Language not available yet
            setTimeout(checkAndApply, 100);
        }
    };
    checkAndApply();
}

// Initialize theme and language from localStorage
(function initThemeAndLang() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
    } else if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
    }
    
    // Show current language on button (FR when French, EN when English)
    const savedLang = localStorage.getItem('language') || 'fr';
    updateLangDisplayButtons(savedLang);
    
    // Listen for languageChanged events from main.js
    window.addEventListener('languageChanged', (e) => {
        const newLang = e.detail?.language || localStorage.getItem('language') || 'fr';
        updateLangDisplayButtons(newLang);
    });
    
    // Apply translations after main.js loads
    const waitForLanguage = () => {
        if (typeof Language !== 'undefined' && Language.apply) {
            Language.apply();
        } else {
            setTimeout(waitForLanguage, 50);
        }
    };
    setTimeout(waitForLanguage, 100);
})();

// Navbar hide/show on scroll with smooth transition
// Hides on scroll down (-20vh), shows on scroll up (0) with 1.5s minimum effect
let lastScrollY = window.scrollY;
let navbarHidden = false;
let scrollTimeout = null;

window.addEventListener('scroll', () => {
    const scrollPos = window.scrollY;
    const navbar = document.getElementById('navbar');
    
    if (!navbar) return;
    
    // Ensure smooth transition is set
    if (!navbar.style.transition.includes('1.5s')) {
        navbar.style.transition = 'transform 1.5s cubic-bezier(0.4, 0, 0.2, 1)';
    }
    
    // Clear any pending timeout
    if (scrollTimeout) clearTimeout(scrollTimeout);
    
    // Hide navbar on scroll down after 100px threshold
    if (scrollPos > lastScrollY && scrollPos > 100 && !navbarHidden) {
        navbar.style.transform = 'translateY(-20vh)';
        navbarHidden = true;
    } 
    // Show navbar on scroll up (with at least 15px movement) or near top
    else if ((scrollPos < lastScrollY - 15 || scrollPos < 50) && navbarHidden) {
        navbar.style.transform = 'translateY(0)';
        navbarHidden = false;
    }
    
    // Update last scroll position after a small delay for smoother tracking
    scrollTimeout = setTimeout(() => {
        lastScrollY = scrollPos;
    }, 50);
});
</script>
