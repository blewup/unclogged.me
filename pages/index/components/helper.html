<script>
(function() {
    // Configuration
    const CONFIG = {
        apiKey: 'AIzaSyCShzljUGrqSmhLDisfdliIitd9cXFRQZ0',
        model: 'gemini-2.5-flash-preview-09-2025',
        ownerPhone: '+14385302343',
        ownerEmail: 'info@deboucheur.expert',
        responseTime: '0-12 heures',
        pollInterval: 10000, // 10 seconds for faster response
        fastPollInterval: 5000, // 5 seconds when waiting for agent
        maxRetries: 3
    };

    const SYSTEM_PROMPT = `Tu es 'L'Apprenti de Billy', un assistant virtuel chaleureux et expert en plomberie résidentielle pour Billy St-Hilaire, Déboucheur Expert basé à Montréal et Montérégie.

SECTIONS DU SITE WEB (utilise ces liens pour guider l'utilisateur):
- Services: #services - Urgences 24/7, Rénovation, Inspection caméra, Débouchage
- FAQ: #faq - Questions fréquentes sur les tarifs, garanties, paiements
- Contact: #contact - Formulaire de contact et coordonnées
- Témoignages: #testimonials - Avis de nos clients satisfaits
- Localisation: #map-section - Notre adresse et zones desservies
- Tarification: pages/prices.html - Détails des prix
- Équipe: pages/team.html - Rencontrer Billy et Nancy
- Outils: pages/tools.html - Équipement professionnel

SERVICES ET TARIFS:
- Débouchage: 200-640$/h selon complexité (câble standard 320$, moyen 480$, gros 560$)
- Rénovation plomberie (salle de bain, cuisine)
- Inspection caméra HD: 150$ avec rapport détaillé
- Urgences 24/7 disponibles

OUTILS PROFESSIONNELS:
- Furet électrique professionnel
- Hydrocureur haute pression
- Caméra d'inspection HD
- Équipement de soudure (MIG, TIG, SMAW)

DÉLAIS DE RÉPONSE:
- SMS: 0-12 heures
- Messagerie vocale: 12-24 heures
- Courriel: 24-48 heures

COMPORTEMENT CONVERSATIONNEL:
- Si l'utilisateur dit "Bonjour", "Salut", "Hi", "Hello", ou similaire, réponds chaleureusement: "Bonjour! 👋 Comment puis-je vous aider aujourd'hui? Je peux vous renseigner sur nos services, nos tarifs, ou analyser une photo de votre problème de plomberie!"
- Sois amical, conversationnel et professionnel
- Réponds en français par défaut, en anglais si demandé ou si le message est en anglais
- Pour les urgences, incite à appeler (438) 530-2343
- IMPORTANT: Quand tu suggères une section du site, formatte le lien comme: <a href="#section" class="text-blue underline hover:text-blue-400">Texte du lien</a>
- Par exemple: "Consultez notre <a href='#services' class='text-blue underline hover:text-blue-400'>section Services</a> pour en savoir plus!"
- Si une photo est envoyée, analyse le problème de plomberie visible et donne des conseils
- Ne donne pas de conseils dangereux (électricité, gaz)
- TRANSFERT À UN EXPERT: Si le client demande explicitement de parler à un humain, un expert, Billy, ou s'il a une question très spécifique que tu ne peux pas résoudre, réponds: "Je transfère votre demande à Billy! 📱 Il vous répondra dans les prochaines minutes à quelques heures. En attendant, n'hésitez pas à me poser d'autres questions!"
- Utilise des emojis pour rendre la conversation plus vivante 🔧💧🛠️`;

    // Agent escalation detection patterns
    const ESCALATION_PATTERNS = [
        /parler.*(?:humain|agent|expert|billy|quelqu'un|personne)/i,
        /(?:talk|speak).*(?:human|agent|expert|someone|person|billy)/i,
        /(?:besoin|need).*(?:aide|help).*(?:vrai|real|humain|human)/i,
        /(?:transfert|transfer|escalade|escalation)/i,
        /(?:pas|not).*(?:satisfait|satisfied|comprends|understand)/i,
        /(?:veux|want|voudrais|would like).*(?:parler|talk|speak).*(?:à|to|with)/i
    ];

    // State
    let uploadedImageBase64 = null;
    let conversationHistory = [];
    let sessionId = 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    let lastResponseId = 0;
    let isWaitingForAgent = false;
    let pollIntervalId = null;
    let seenResponseIds = new Set();

    // Determine paths based on page location
    const isIndexPage = window.location.pathname.endsWith('index.html') || 
                        window.location.pathname.endsWith('/') ||
                        window.location.pathname === '';
    const apiBasePath = isIndexPage ? 'api/' : '../api/';
    const assetsBasePath = isIndexPage ? 'assets/' : '../assets/';

    // Set logo image path
    const logoImg = document.getElementById('helper-logo-img');
    if (logoImg) {
        logoImg.src = assetsBasePath + 'images/logo/logo.png';
    }

    // DOM elements
    const toggleBtn = document.getElementById('helper-toggle-btn');
    const closeBtn = document.getElementById('helper-close-btn');
    const widget = document.getElementById('ai-chat-widget');
    const messagesDiv = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('helper-send-btn');
    const imageUpload = document.getElementById('helper-image-upload');
    const fileName = document.getElementById('helper-file-name');
    const escalateBtn = document.getElementById('helper-escalate-btn');

    // Toggle chat widget
    function toggleChat() {
        if (widget) {
            widget.classList.toggle('hidden-widget');
            if (!widget.classList.contains('hidden-widget') && chatInput) {
                setTimeout(() => chatInput.focus(), 100);
            }
        }
    }

    // Event listeners
    if (toggleBtn) toggleBtn.addEventListener('click', toggleChat);
    if (closeBtn) closeBtn.addEventListener('click', toggleChat);
    if (sendBtn) sendBtn.addEventListener('click', sendMessage);
    if (chatInput) {
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    }
    if (imageUpload) {
        imageUpload.addEventListener('change', handleImageUpload);
    }
    if (escalateBtn) {
        escalateBtn.addEventListener('click', requestAgentEscalation);
    }

    // Handle image upload
    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        if (fileName) fileName.innerText = file.name;
        
        const reader = new FileReader();
        reader.onloadend = () => {
            uploadedImageBase64 = reader.result.split(',')[1];
            addMessage(`<img src="${reader.result}" class="max-w-[150px] rounded-lg border border-white/20">`, 'user');
        };
        reader.readAsDataURL(file);
    }

    // Add message to chat
    function addMessage(content, type = 'ai') {
        if (!messagesDiv) return;
        
        const msgDiv = document.createElement('div');
        msgDiv.className = type === 'user' ? 'user-msg' : 
                           type === 'owner' ? 'owner-msg bg-green-800/50 text-white p-3 rounded-lg border-l-4 border-green-500' : 
                           'ai-msg';
        msgDiv.innerHTML = content;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Send message to AI and forward to owner
    async function sendMessage() {
        const message = chatInput ? chatInput.value.trim() : '';
        if (!message && !uploadedImageBase64) return;

        // Add user message to chat
        if (message) {
            addMessage(message, 'user');
            chatInput.value = '';
        }

        // Store in conversation history
        conversationHistory.push({
            role: 'user',
            content: message,
            timestamp: new Date().toISOString(),
            hasImage: !!uploadedImageBase64
        });

        // Show typing indicator
        const loadingId = 'loading-' + Date.now();
        const loadingDiv = document.createElement('div');
        loadingDiv.id = loadingId;
        loadingDiv.className = 'ai-msg';
        loadingDiv.innerHTML = '<span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
        messagesDiv.appendChild(loadingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Prepare API request
        const parts = [];
        if (message) parts.push({ text: message });
        if (uploadedImageBase64) {
            parts.push({ inlineData: { mimeType: "image/jpeg", data: uploadedImageBase64 } });
            uploadedImageBase64 = null;
            if (fileName) fileName.innerText = '';
        }

        try {
            // Call Gemini API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${CONFIG.model}:generateContent?key=${CONFIG.apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: parts }],
                    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                })
            });

            const data = await response.json();
            const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "Erreur d'analyse.";

            // Remove loading indicator and show response
            const loader = document.getElementById(loadingId);
            if (loader) loader.remove();
            
            addMessage(aiResponse.replace(/\n/g, '<br>'), 'ai');

            // Store AI response in history
            conversationHistory.push({
                role: 'assistant',
                content: aiResponse,
                timestamp: new Date().toISOString()
            });

            // Check if escalation was requested
            const userRequestedEscalation = detectEscalation(message);
            const aiSuggestedEscalation = /transfère|transfer|Billy.*répond|will respond|prochaines minutes/i.test(aiResponse);
            
            // Forward conversation to owner via backend
            await forwardToOwner(message, aiResponse, userRequestedEscalation || aiSuggestedEscalation);

        } catch (error) {
            const loader = document.getElementById(loadingId);
            if (loader) loader.remove();
            addMessage('Erreur de connexion. Veuillez appeler le (438) 530-2343 pour assistance.', 'ai');
        }
    }

    // Forward conversation to owner via SMS and email
    async function forwardToOwner(userMessage, aiResponse, forceEscalation = false) {
        try {
            const response = await fetch(apiBasePath + 'chat-forward.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: sessionId,
                    userMessage: userMessage,
                    aiResponse: aiResponse,
                    conversationHistory: conversationHistory,
                    timestamp: new Date().toISOString(),
                    pageUrl: window.location.href,
                    isEscalation: forceEscalation || isWaitingForAgent,
                    lang: document.documentElement.lang || 'fr'
                })
            });
            
            // If escalation, enable fast polling
            if (forceEscalation) {
                isWaitingForAgent = true;
                startFastPolling();
            }
        } catch (error) {
            console.log('Forward failed, continuing conversation locally');
        }
    }

    // Check if message requests agent escalation
    function detectEscalation(message) {
        return ESCALATION_PATTERNS.some(pattern => pattern.test(message));
    }

    // Start faster polling when waiting for agent
    function startFastPolling() {
        if (pollIntervalId) clearInterval(pollIntervalId);
        pollIntervalId = setInterval(checkOwnerResponses, CONFIG.fastPollInterval);
        
        // Show waiting indicator
        showAgentWaitingIndicator();
    }

    // Show agent waiting indicator
    function showAgentWaitingIndicator() {
        const existingIndicator = document.getElementById('agent-waiting-indicator');
        if (existingIndicator) return;
        
        const indicator = document.createElement('div');
        indicator.id = 'agent-waiting-indicator';
        indicator.className = 'flex items-center gap-2 px-3 py-2 bg-green-900/30 border border-green-700 rounded-lg text-green-400 text-xs font-inter';
        indicator.innerHTML = `
            <span class="inline-block w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
            <span data-translate="helper_waiting_for_agent">En attente de Billy...</span>
        `;
        
        const inputArea = document.querySelector('#ai-chat-widget .p-3.bg-gray-900');
        if (inputArea) inputArea.insertBefore(indicator, inputArea.firstChild);
    }

    // Remove agent waiting indicator
    function hideAgentWaitingIndicator() {
        const indicator = document.getElementById('agent-waiting-indicator');
        if (indicator) indicator.remove();
    }

    // Poll for owner responses with lastId tracking
    async function checkOwnerResponses() {
        try {
            const response = await fetch(apiBasePath + 'chat-responses.php?sessionId=' + sessionId + '&lastId=' + lastResponseId);
            const data = await response.json();
            
            if (data.responses && data.responses.length > 0) {
                data.responses.forEach(resp => {
                    // Prevent duplicates using Set
                    if (!seenResponseIds.has(resp.id)) {
                        seenResponseIds.add(resp.id);
                        addMessage(`<strong class="text-green-400">🔧 Billy:</strong> ${resp.message}`, 'owner');
                        conversationHistory.push({
                            role: 'owner',
                            content: resp.message,
                            timestamp: resp.timestamp
                        });
                        
                        // Play notification sound
                        playNotificationSound();
                        
                        // Hide waiting indicator when agent responds
                        hideAgentWaitingIndicator();
                        isWaitingForAgent = false;
                        
                        // Slow down polling again
                        if (pollIntervalId) clearInterval(pollIntervalId);
                        pollIntervalId = setInterval(checkOwnerResponses, CONFIG.pollInterval);
                    }
                });
                
                // Update lastId for next poll
                if (data.lastId) lastResponseId = data.lastId;
            }
        } catch (error) {
            // Silent fail for polling
        }
    }

    // Play notification sound for owner message
    function playNotificationSound() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        } catch (e) {
            // Audio not supported, fail silently
        }
    }

    // Request agent escalation manually
    function requestAgentEscalation() {
        const escalationMsg = document.documentElement.lang === 'en' 
            ? "I would like to speak with Billy please."
            : "Je voudrais parler à Billy s'il vous plaît.";
        
        if (chatInput) {
            chatInput.value = escalationMsg;
            sendMessage();
        }
    }

    // Poll at normal interval initially
    pollIntervalId = setInterval(checkOwnerResponses, CONFIG.pollInterval);

    // Expose for external use
    window.HelperWidget = { 
        toggleChat, 
        sendMessage, 
        requestAgentEscalation,
        getSessionId: () => sessionId,
        isWaitingForAgent: () => isWaitingForAgent
    };

    // PARALLAX & TILT EFFECTS FOR HELPER LOGO
    (function initParallaxTilt() {
        const helperBtn = document.getElementById('helper-toggle-btn');
        const helperLogo = document.getElementById('helper-logo-img');
        if (!helperBtn || !helperLogo) return;

        let tiltX = 0, tiltY = 0;
        let scrollOffset = 0;
        let rafId = null;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Apply combined transform
        function applyTransform() {
            const baseTranslateY = -15 + (scrollOffset * 0.08);
            const scale = 1 + Math.min(scrollOffset * 0.0003, 0.08);
            helperLogo.style.transform = `
                perspective(800px)
                translateY(${scrollOffset * 0.05}px)
                rotateX(${tiltY * 0.5}deg)
                rotateY(${-tiltX * 0.5}deg)
                scale(${scale})
            `;
        }

        // Scroll parallax effect
        function handleScroll() {
            scrollOffset = window.scrollY;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(applyTransform);
        }

        // Mouse-based tilt effect (desktop)
        function handleMouseMove(e) {
            if (isMobile) return;
            const rect = helperBtn.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const distX = (e.clientX - centerX) / (window.innerWidth / 2);
            const distY = (e.clientY - centerY) / (window.innerHeight / 2);
            tiltX = distX * 15;
            tiltY = distY * 15;
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(applyTransform);
        }

        // Device orientation tilt effect (mobile)
        function handleOrientation(e) {
            if (!isMobile) return;
            const gamma = e.gamma || 0;
            const beta = e.beta || 0;
            tiltX = Math.max(-20, Math.min(20, gamma * 0.6));
            tiltY = Math.max(-20, Math.min(20, (beta - 45) * 0.4));
            if (rafId) cancelAnimationFrame(rafId);
            rafId = requestAnimationFrame(applyTransform);
        }

        function requestOrientationPermission() {
            if (typeof DeviceOrientationEvent !== 'undefined' && 
                typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(response => {
                        if (response === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
        }

        helperBtn.addEventListener('mouseenter', () => {
            helperLogo.style.transition = 'transform 0.3s ease-out';
        });

        helperBtn.addEventListener('mouseleave', () => {
            tiltX = 0;
            tiltY = 0;
            helperLogo.style.transition = 'transform 0.5s ease-out';
            applyTransform();
        });

        window.addEventListener('scroll', handleScroll, { passive: true });
        
        if (isMobile) {
            document.addEventListener('touchstart', function initOrientation() {
                requestOrientationPermission();
                document.removeEventListener('touchstart', initOrientation);
            }, { once: true });
        } else {
            window.addEventListener('mousemove', handleMouseMove, { passive: true });
        }

        handleScroll();
    })();
})();
</script>

}

.ai-msg {

.owner-msg {

.typing-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #9ca3af;
    border-radius: 50%;
    margin: 0 2px;
    animation: typing-bounce 1.4s infinite ease-in-out both;
}

.typing-dot:nth-child(1) { animation-delay: -0.32s; }
.typing-dot:nth-child(2) { animation-delay: -0.16s; }
.typing-dot:nth-child(3) { animation-delay: 0s; }

@keyframes typing-bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

.animate-bounce-slow {
    animation: bounce 3.53s infinite;
}

@keyframes bounce {
    0%, 100% { transform: translateY(-15%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
    50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
}
