        function getGoogleShoppingUrl(toolName) {
            const query = toolName.replace(/[^\w\s]/g, '').replace(/\s+/g, '+');
            return `https://www.google.com/search?udm=28&q=${query}`;
        }

        // Build tool cards
        function buildToolCards(filter = '') {
            const container = document.getElementById('tools-grid');
            if (!container) return;
            container.innerHTML = '';
            const lowerFilter = filter.toLowerCase();
            
            const labels = translations[currentLang];
            const sizesLabel = labels.sizes_label || 'Sizes';
            const utilityLabel = labels.utility_label || 'Uses';
            
            toolsData.forEach((tool) => {
                const data = translations[currentLang][tool.key];
                if (!data) return;
                
                const nameMatch = data.name.toLowerCase().includes(lowerFilter);
                const descMatch = data.desc.toLowerCase().includes(lowerFilter);
                const sizesMatch = data.sizes ? data.sizes.toLowerCase().includes(lowerFilter) : false;
                if (filter && !(nameMatch || descMatch || sizesMatch)) return;
                
                const shoppingUrl = getGoogleShoppingUrl(data.name);
                
                const card = document.createElement('a');
                card.href = shoppingUrl;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                card.className = 'tool-card bg-white dark:bg-white/5 p-4 rounded-lg border border-gray-200 dark:border-white/10 shadow-md flex flex-col cursor-pointer hover:scale-[1.02] hover:shadow-lg transition-all';
                
                // Build sizes and utility info if available
                let extraInfo = '';
                if (data.sizes) {
                    extraInfo += `<div class="mt-2 text-xs"><span class="text-blue font-bold">${sizesLabel}:</span> <span class="opacity-80">${data.sizes}</span></div>`;
                }
                if (data.utility) {
                    extraInfo += `<div class="mt-1 text-xs"><span class="text-green font-bold">${utilityLabel}:</span> <span class="opacity-80">${data.utility}</span></div>`;
                }
                if (data.priceRange) {
                    extraInfo += `<div class="mt-2 text-sm font-ops text-cardinal">${data.priceRange}</div>`;
                }
                
                card.innerHTML = `
                    <div class="w-full aspect-square bg-gray-100 dark:bg-gray-800 rounded-lg mb-3 overflow-hidden" style="border-radius: 8px;">
                        <img src="${tool.img}" alt="${data.name}" class="w-full h-full object-cover" style="border-radius: 8px; aspect-ratio: 1/1;" onerror="this.src='../assets/images/logo/logo.png'">
                    </div>
                    <h3 class="text-base font-ops text-blue mb-1">${data.name}</h3>
                    <p class="text-xs text-gray-600 dark:text-gray-300 flex-grow leading-relaxed">${data.desc}</p>
                    ${extraInfo}
                `;
                
                container.appendChild(card);
            });
        }

        // Apply translations
        function applyTranslations() {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                if (translations[currentLang][key]) {
                    if (typeof translations[currentLang][key] === 'string') {
                        el.innerText = translations[currentLang][key];
                    }
                }
            });
            
            // Update search placeholder
            const searchInput = document.getElementById('tool-search');
            if (searchInput) {
                searchInput.placeholder = translations[currentLang].search_placeholder || 'Search...';
            }
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            buildToolCards();
            
            // Search functionality
            const searchInput = document.getElementById('tool-search');
            if (searchInput) {
                searchInput.addEventListener('input', (ev) => {
                    buildToolCards(ev.target.value.trim());
                });
            }
        });
        
        // Listen for language change from navbar component
        window.addEventListener('languageChanged', () => {
            currentLang = localStorage.getItem('language') || 'fr';
            applyTranslations();
            buildToolCards(document.getElementById('tool-search')?.value || '');
        });
    </script>

    <!-- Dynamic Components: Cookie Banner & AI Helper -->
    <div id="pages-banner-container"></div>
    <div id="pages-helper-container"></div>

    <!-- Core Libraries -->
    <script src="../assets/scripts/libs.js" defer></script>
    <script src="../assets/scripts/main.js" defer></script>
    <script src="../assets/scripts/time.js" defer></script>
    <script src="../assets/scripts/components/loader.js"></script>
    <script src="../assets/scripts/icons.js" defer></script>
</body>
