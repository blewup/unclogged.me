; Déboucheur Expert - PHP Configuration for cPanel Shared Hosting
; This file is read by PHP on cPanel (CGI/FastCGI mode)
; Version 2.1.0

; ============================================================================
; ERROR HANDLING
; ============================================================================
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = api/logs/php_errors.log

; ============================================================================
; SECURITY
; ============================================================================
expose_php = Off
allow_url_fopen = On
allow_url_include = Off

; ============================================================================
; SESSION
; ============================================================================
session.cookie_httponly = On
session.cookie_secure = On
session.use_only_cookies = On
session.cookie_samesite = Lax
session.name = DEXP_SESSID
session.gc_maxlifetime = 3600
session.entropy_length = 32

; ============================================================================
; UPLOAD & POST
; ============================================================================
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 5
file_uploads = On

; ============================================================================
; EXECUTION LIMITS
; ============================================================================
max_execution_time = 30
max_input_time = 30
memory_limit = 128M
max_input_vars = 1000

; ============================================================================
; OUTPUT
; ============================================================================
output_buffering = 4096
implicit_flush = Off
zlib.output_compression = On
zlib.output_compression_level = 6

; ============================================================================
; MBSTRING
; ============================================================================
mbstring.internal_encoding = UTF-8
mbstring.http_output = UTF-8

; ============================================================================
; DATE/TIME
; ============================================================================
date.timezone = America/Montreal

; ============================================================================
; OPCACHE (if available)
; ============================================================================
opcache.enable = On
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 2000
opcache.revalidate_freq = 60
opcache.fast_shutdown = On
opcache.enable_cli = Off
